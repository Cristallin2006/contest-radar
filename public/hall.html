<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="竞赛馆：收录竞赛雷达全部赛事系列与届次，附简介、类别、地区、报名截止与官网链接。">
<title>竞赛馆 · 竞赛雷达</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/hall.css?v=20261123a">
</head>
<body>
<header class="hall-top">
  <a class="hall-brand" href="/"><span class="mark" aria-hidden="true"></span>竞赛雷达</a>
  <nav class="hall-nav" aria-label="站点导航">
    <a class="active" href="/hall" aria-current="page">竞赛馆</a>
    <a href="/">赛事线路图</a>
    <a href="/list">卡片列表</a>
    <a href="/changes">公开变更</a>
    <a href="/api/v1/ical/all.ics">ICS 订阅</a>
  </nav>
</header>
<main class="hall-shell">
  <section class="hall-hero">
    <p class="eyebrow">COMPETITION HALL / ALL EDITIONS</p>
    <h1>竞赛馆</h1>
    <p class="lede">把所有已收录的竞赛摊开：系列、届次、主办方、简介、类别、地区和下一次报名截止。先看全貌，再决定参加哪一场。</p>
    <div id="hallStats" class="hall-stats" aria-live="polite"></div>
  </section>

  <section class="hall-toolbar" aria-label="竞赛馆筛选">
    <div class="hall-filters">
      <div id="hallRegions" class="hall-regions" role="group" aria-label="地区"></div>
      <div id="hallCats" class="hall-cats" role="group" aria-label="类别"></div>
    </div>
    <div class="hall-tools-right">
      <label class="hall-search"><span class="sr-only">搜索竞赛</span><input id="hallSearch" type="search" placeholder="搜索赛事、系列、主办方、简介…" autocomplete="off"></label>
      <span id="hallCount" class="hall-count">正在加载…</span>
      <button id="hallReset" class="hall-reset" type="button">重置</button>
    </div>
  </section>

  <div id="hallList" class="hall-list" aria-live="polite">
    <div class="hall-empty"><strong>正在加载竞赛馆…</strong></div>
  </div>

  <footer class="hall-footer">
    <span>数据来自各公开来源；简介为结构化摘要，日期与报名要求以主办方官网为准。</span>
    <span><a href="/">线路图</a> · <a href="/list">卡片列表</a> · <a href="/changes">变更</a> · <a href="/admin">管理</a></span>
  </footer>
</main>
<script src="/hall.js?v=20261123a" defer></script>
</body>
</html>
