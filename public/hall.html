<head>

<meta name="description" content="竞赛馆：收录竞赛雷达全部赛事系列与届次，附简介、类别、地区、报名截止与官网链接。">
<title>竞赛馆 · 竞赛雷达</title>

<meta property="og:title" content="竞赛馆 · 竞赛雷达">
<meta property="og:description" content="竞赛雷达全部赛事系列与届次，附简介、类别、地区、报名截止与官网链接。">
<meta property="og:url" content="https://contest.07212006.xyz/hall">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/hall.css?v=20261124f">
</head>
<body>
<header class="hall-top">
  <a class="hall-brand" href="/"><span class="mark" aria-hidden="true"></span>竞赛雷达</a>
  <nav class="hall-nav" aria-label="站点导航">
    <a class="active" href="/hall" aria-current="page">竞赛馆</a>
    <a href="/">赛事线路图</a>
    <a href="/list">卡片列表</a>
    <a href="/submit">投稿</a>
    <a href="/board">留言板</a>
    <a href="/changes">公开变更</a>
    <a href="/api/v1/ical/all.ics">ICS 订阅</a>
  </nav>
</header>
<main class="hall-shell">
  <section class="hall-hero">
    <p class="eyebrow">COMPETITION HALL / ALL EDITIONS</p>
    <h1>竞赛馆</h1>
    <p class="lede">把所有已收录的竞赛摊开：系列、届次、主办方、简介、类别、地区和下一次报名截止。先看全貌，再决定参加哪一场。</p>
    <div id="hallStats" class="hall-stats" aria-live="polite"></div>
  </section>

  <section class="hall-cta" aria-label="参与竞赛雷达">
    <div><strong>竞赛馆由大家一起补全</strong><span>发现遗漏赛事就投稿；想讨论赛制、报名和备赛，可以去留言板。</span></div>
    <div class="hall-cta-links"><a class="primary" href="/submit">投稿竞赛</a><a class="secondary" href="/board">留言板</a></div>
  </section>

  <section class="hall-toolbar" aria-label="竞赛馆筛选">
    <div class="hall-filters">
      <div id="hallRegions" class="hall-regions" role="group" aria-label="地区"></div>
      <div id="hallCats" class="hall-cats" role="group" aria-label="类别"></div>
      <div id="hallFields" class="hall-fields" role="group" aria-label="方向"></div>
      <label class="hall-tech"><input id="hallTech" type="checkbox" /> 只看技术向</label>
    </div>
    <div class="hall-tools-right">
      <label class="hall-search"><span class="sr-only">搜索竞赛</span><input id="hallSearch" type="search" placeholder="搜索赛事、系列、主办方、简介…" autocomplete="off"></label>
      <span id="hallCount" class="hall-count">正在加载…</span>
      <button id="hallReset" class="hall-reset" type="button">重置</button>
    </div>
  </section>

  <div id="hallList" class="hall-list" aria-live="polite">
    <div class="hall-empty"><strong>正在加载竞赛馆…</strong></div>
  </div>

  <dialog id="hallDetail" class="hall-dialog" aria-labelledby="hallDetailTitle">
    <div class="hall-dialog-bar">
      <span>赛事详情</span>
      <button id="hallDetailClose" type="button" class="hall-dialog-close">关闭</button>
    </div>
    <div id="hallDetailBody" class="hall-detail-body"></div>
  </dialog>

  <footer class="hall-footer">
    <span>数据为公开来源聚合，时间、地区、主办方等可能不准确；请以主办方官网为准并自行核实。</span>
    <span class="site-days" data-site-days>本站已运行 — 天</span>
    <span><a href="/miit">工信部相关</a> · <a href="/docs.html">文档 / API</a> · <a href="/">线路图</a> · <a href="/list">卡片列表</a> · <a href="/changes">变更</a></span>
  </footer>
</main>
<script src="/site-days.js?v=20261123a" defer></script>
<script src="/hall.js?v=20261123h" defer></script>
</body>
</html>
